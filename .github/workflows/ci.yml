name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONIOENCODING: "utf-8"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Runtime, Simulator, and Firmware
    runs-on: windows-latest
    timeout-minutes: 25

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare build metadata
        run: |
          $ShortSha = $env:GITHUB_SHA.Substring(0, 7)
          "SHORT_SHA=$ShortSha" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-console/frontend/package-lock.json

      - name: Repository hygiene
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            $Range = "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          } elseif ($env:GITHUB_EVENT_NAME -eq "push" -and "${{ github.event.before }}" -notmatch "^0+$") {
            $Range = "${{ github.event.before }}...${{ github.sha }}"
          } elseif (git rev-parse HEAD~1 2>$null) {
            $Range = "HEAD~1...HEAD"
          } else {
            $Range = "HEAD"
          }

          Write-Host "Running git diff --check $Range"
          git diff --check $Range
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $Forbidden = git ls-files | Select-String -Pattern '(^|/)__pycache__/|\.pyc$|^\.build/|\.log$|\.tmp$'
          if ($Forbidden) {
            Write-Error "Tracked generated or local-only files detected:`n$Forbidden"
            exit 1
          }

      - name: AI and Runtime tests
        working-directory: ai-controller
        run: |
          powershell -ExecutionPolicy Bypass -File .\run-tests.ps1
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          "## AI tests`n`n- Result: PASS`n- Command: powershell -ExecutionPolicy Bypass -File .\run-tests.ps1`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Install Web API optional dependencies
        working-directory: ai-controller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[web]"

      - name: Web API tests
        working-directory: ai-controller
        env:
          SESAME_AI_PROVIDER: mock
        run: |
          powershell -ExecutionPolicy Bypass -File .\run-web-tests.ps1
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          python -c "from sesame_ai_robot.web.app import create_app; from sesame_ai_robot.web.security import TEST_ALLOWED_HOSTS; app=create_app(allowed_hosts=TEST_ALLOWED_HOSTS); schema=app.openapi(); assert '/api/chat' in schema['paths']; print('OpenAPI paths:', len(schema['paths']))"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          "## Web API tests`n`n- Result: PASS`n- Web extra installed: YES`n- Skipped tests: 0`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Firmware size parser tests
        run: |
          python -m unittest discover -s scripts/tests
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          "## Firmware size parser tests`n`n- Result: PASS`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Runtime CLI dry-runs
        working-directory: ai-controller
        run: |
          powershell -ExecutionPolicy Bypass -File .\run-cli.ps1 runtime-step --mode mock --dry-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -ExecutionPolicy Bypass -File .\run-cli.ps1 runtime-run --mode simulator --steps 3 --dry-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -ExecutionPolicy Bypass -File .\run-cli.ps1 runtime-confirmation-demo --mode mock --dry-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "## Runtime CLI dry-runs`n`n- runtime-step: PASS`n- runtime-run: PASS`n- runtime-confirmation-demo: PASS`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: AI interaction evals
        working-directory: ai-controller
        run: |
          powershell -ExecutionPolicy Bypass -File .\run-cli.ps1 ai-command --provider mock --mode simulator --text "battery status" --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -ExecutionPolicy Bypass -File .\run-cli.ps1 ai-command --provider mock --mode simulator --text "walk forward" --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -ExecutionPolicy Bypass -File .\run-cli.ps1 ai-eval --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "## AI interaction evals`n`n- ai-command query: PASS`n- ai-command confirmation request: PASS`n- ai-eval: PASS`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Simulator scenarios
        run: |
          powershell -ExecutionPolicy Bypass -File .\simulator\run-scenarios.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -ExecutionPolicy Bypass -File .\simulator\run-advanced-scenarios.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -ExecutionPolicy Bypass -File .\simulator\run-integrated-scenarios.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -ExecutionPolicy Bypass -File .\simulator\run-hardware-scenarios.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "## Simulator scenarios`n`n- Normal: PASS`n- Advanced: PASS`n- Integrated: PASS`n- Virtual hardware: PASS`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Python syntax validation
        run: |
          python -m compileall ai-controller simulator scripts
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          "## Python syntax validation`n`n- Result: PASS`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Frontend dependencies
        working-directory: web-console/frontend
        run: |
          npm ci

      - name: Frontend lint
        working-directory: web-console/frontend
        run: |
          npm run lint

      - name: Frontend typecheck
        working-directory: web-console/frontend
        run: |
          npm run typecheck

      - name: Frontend unit tests
        working-directory: web-console/frontend
        run: |
          npm run test:unit

      - name: Frontend build
        working-directory: web-console/frontend
        run: |
          npm run build

      - name: Install Playwright browser
        working-directory: web-console/frontend
        run: |
          npx playwright install chromium

      - name: Frontend E2E
        working-directory: web-console/frontend
        env:
          SESAME_AI_PROVIDER: mock
        run: |
          npm run test:e2e
          Get-Content playwright-report\e2e-summary.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Verify frontend browser artifact allowlist
        if: always()
        run: |
          $ForbiddenPatterns = @(
            "web-console/frontend/playwright-report/results.json",
            "web-console/frontend/playwright-report/.raw-results.json",
            "web-console/frontend/playwright-report/index.html",
            "web-console/frontend/playwright-report/data",
            "web-console/frontend/blob-report",
            "web-console/frontend/**/trace.zip",
            "web-console/frontend/**/*.har",
            "web-console/frontend/**/*.webm",
            "web-console/frontend/**/*.mp4",
            "web-console/frontend/**/network*",
            "web-console/frontend/**/request-body*"
          )
          $Found = @()
          foreach ($Pattern in $ForbiddenPatterns) {
            $Matches = Get-ChildItem -Path $Pattern -Force -ErrorAction SilentlyContinue
            if ($Matches) {
              $Found += $Matches.FullName
            }
          }
          if ($Found.Count -gt 0) {
            Write-Error "Forbidden frontend browser artifacts detected before upload."
            $Found | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Upload frontend browser artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sesame-web-console-browser-${{ env.SHORT_SHA }}
          path: |
            web-console/frontend/test-results/*.png
            web-console/frontend/playwright-report/e2e-summary.json
            web-console/frontend/playwright-report/e2e-summary.md
            web-console/frontend/playwright-report/e2e-failure-summary.md
          if-no-files-found: warn
          retention-days: 14

      - name: Set up Arduino CLI
        run: |
          $ArduinoCliVersion = "1.5.1"
          $Archive = Join-Path $env:RUNNER_TEMP "arduino-cli.zip"
          $InstallDir = Join-Path $env:RUNNER_TEMP "arduino-cli"
          New-Item -ItemType Directory -Path $InstallDir -Force | Out-Null
          Invoke-WebRequest `
            -Uri "https://downloads.arduino.cc/arduino-cli/arduino-cli_${ArduinoCliVersion}_Windows_64bit.zip" `
            -OutFile $Archive
          Expand-Archive -Path $Archive -DestinationPath $InstallDir -Force
          $CliPath = Get-ChildItem -Path $InstallDir -Recurse -Filter arduino-cli.exe | Select-Object -First 1
          if (-not $CliPath) {
            Write-Error "arduino-cli.exe was not found after extraction"
            exit 1
          }
          $CliDir = Split-Path -Parent $CliPath.FullName
          "$CliDir" | Out-File -FilePath $env:GITHUB_PATH -Append
          & $CliPath.FullName version

      - name: Cache Arduino packages and libraries
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\Arduino15
            ~\Documents\Arduino\libraries
          key: arduino-windows-cli-1.5.1-esp32-3.3.10-libs-esp32servo-3.0.9-ssd1306-2.5.17-gfx-1.12.6-json-6.21.5
          restore-keys: |
            arduino-windows-cli-1.5.1-esp32-3.3.10-

      - name: Install ESP32 board core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10

      - name: Firmware build
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\firmware-build.ps1 2>&1 | Tee-Object -FilePath artifacts\firmware-build.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Firmware size guard
        run: |
          python .\scripts\check_firmware_size.py `
            --build-log artifacts\firmware-build.log `
            --flash-warning-percent 88 `
            --flash-failure-percent 92 `
            --summary-file artifacts\firmware-size.md
          $SizeExitCode = $LASTEXITCODE
          Get-Content artifacts\firmware-size.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($SizeExitCode -eq 2) {
            exit 2
          }
          if ($SizeExitCode -eq 1) {
            Write-Warning "Firmware flash usage is above the warning threshold."
          }

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v6
        with:
          name: sesame-firmware-${{ env.SHORT_SHA }}-ci
          path: |
            .build/output/*
            artifacts/firmware-build.log
            artifacts/firmware-size.md
          if-no-files-found: error
          retention-days: 14
