[project]
name = "sesame-ai-controller"
version = "0.1.0"
description = "Computer-side controller foundation for Sesame AI Robot"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1",
    "httpx2>=2,<3",
    "pydantic>=2,<3",
    "uvicorn>=0.30,<1",
]

[tool.setuptools.packages.find]
include = ["sesame_ai_robot*"]
exclude = ["evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
